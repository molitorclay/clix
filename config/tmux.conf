# remap prefix to Control + a
set -g prefix C-a
# bind 'C-a C-a' to type 'C-a'
bind C-a send-prefix
unbind C-b
#enable mouse scrolling
set -g mouse on

# Index panes to 1 for better hotkeys
set -g base-index 1
setw -g pane-base-index 1

# Change copy mode keybinds
set-window-option -g mode-keys vi

# Disable automatically "hold" command key.
set -g repeat-time 50

# vim keys for navigating
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Colors
set -g default-terminal "tmux-256color"
set -g pane-active-border-style 'fg=color208 bg=color234'
set -g pane-border-style 'bg=color234'
set -g focus-events on

# Set active window to black, others to grey
set -g window-style 'bg=color234'
set -g window-active-style 'bg=color233'

# Bottom bar: tmux session/windows
set -g status on
set -g status-position bottom
set -g status-style 'fg=color7 bg=color94'

# Top bar: powerline system info (hostname, cpu, battery, time)
set -g status2 on
set -g status2-position top

# Allow images to be displayed in tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# tmux-yank: copy to system clipboard in copy mode
set -g @yank_selection_mouse 'clipboard'
